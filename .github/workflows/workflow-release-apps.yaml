name: Release apps

on:
  workflow_call:
    inputs:
      snapshot-release:
        description: 'Snapshot release?'
        type: boolean
        required: true
        default: false
      release-version:
        description: 'Apps release version'
        type: string
        required: false

jobs:
  release-apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./digiwf-apps
    steps:
      - uses: ./github/workflows/workflow-build-apps
      - run: lerna publish from-package --yes
        if: github.event.inputs.snapshot-release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_KEY }}

      - name: Build and push tasklist
        uses: docker/build-push-action@v4
        with:
          context: ./digiwf-apps/packages/apps/digiwf-tasklist
          push: true
          tags: itatm/digiwf-tasklist:${{ github.event.inputs.release-version }},itatm/digiwf-tasklist:dev
