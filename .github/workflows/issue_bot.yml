name: Contribution Bot

on:
  issues:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'Auto-assign issue'
        if: github.event.issue.author_association != 'COLLABORATOR'
        uses: pozil/auto-assign-issue@v1
        with:
          teams: digiwf_maintainer
          numOfAssignee: 2
          allowSelfAssign: false
