name: Release services

on:
  workflow_call:
    inputs:
      snapshot-release:
        description: 'Snapshot release?'
        type: boolean
        required: true
        default: false
      maven-release:
        description: 'Maven release?'
        type: boolean
        required: false
        default: true
      release-version:
        description: 'Services release version'
        type: string
        required: false

jobs:
  release-services:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Java and Maven
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: 'adopt'

      - name: Remove SNAPSHOT
        if: github.event.inputs.snapshot-release == 'false'
        run: |
          mvn versions:set --batch-mode -DremoveSnapshot -DprocessAllModules

      - name: Build with Maven
        run: mvn --batch-mode install -DskipTests

      - name: Release Maven package
        if: github.event.inputs.maven-release == 'true'
        run: echo "maven release"
