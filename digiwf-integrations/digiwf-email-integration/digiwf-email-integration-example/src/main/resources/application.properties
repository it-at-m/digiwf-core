server.port=10005
logging.level.io.muenchendigital=info
logging.level.org.springframework=info
# env may be local,dev,test,demo,processesdemo, ...
digiwf.env=local
# streaming topics
digiwf.streaming.engine.topics=dwf-digiwf-engine-${digiwf.env}
digiwf.streaming.email.topics=dwf-email-${digiwf.env}
digiwf.streaming.group="dwf-email-service"
# streaming
spring.cloud.stream.function.routing.enabled=true
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.function.definition=sendCorrelateMessage;functionRouter;
spring.cloud.stream.bindings.functionRouter-in-0.destination=${digiwf.streaming.email.topics}
spring.cloud.stream.bindings.functionRouter-in-0.group=${digiwf.streaming.group}
spring.cloud.stream.bindings.sendCorrelateMessage-out-0.destination=${digiwf.streaming.engine.topics}
#kafka config
spring.cloud.stream.kafka.binder.consumerProperties.key.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.cloud.stream.kafka.binder.consumerProperties.value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.cloud.stream.kafka.binder.producerProperties.key.serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.cloud.stream.kafka.binder.producerProperties.value.serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# default email settings for mailhog
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=digiwf@example.de
spring.mail.password=test
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.tls=false
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.host=localhost
spring.mail.properties.mail.smtp.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=1000000
spring.mail.properties.mail.smtp.timeout=1000000
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.trust="*"
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.socketFactory.fallback=true
spring.mail.properties.mail.smtp.starttls.enable=false
io.muenchendigital.digiwf.mail.fromAddress=${spring.mail.username}
