# Serivce Setup
spring:
  application:
    name: '@project.artifactId@'
server:
  shutdown: graceful
  port: ${COSYS_INTEGRATION_SERVER_PORT:8080}

# Cosys Setup
io:
  muenchendigital:
    digiwf:
      cosys:
        url:
        merge:
          datafile: /root/multi
          inputLanguage: Deutsch
          outputLanguage: Deutsch
          keepFields: unresolved-ref

# S3 Setup
digiwf:
  s3:
    client:
      document-storage-url: '${DIGIWF_S3_HTTPAPI:http://localhost:8086}'
      max-file-size: ${S3_MAX_FILE_SIZE:100MB}

# Monitoring Setup
management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health, info, prometheus, livenessstate, readinessstate
        path-mapping:
          prometheus: metrics
