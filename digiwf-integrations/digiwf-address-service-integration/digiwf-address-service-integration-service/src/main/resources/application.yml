management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health, info, prometheus, livenessstate, readinessstate
        path-mapping:
          prometheus: metrics
  server:
    port: ${server.port}
server:
  error:
    include-exception: false
    include-stacktrace: never
    whitelabel:
      enabled: false
  port: ${ADDRESS_INTEGRATION_SERVER_PORT}
  shutdown: graceful
spring:
  application:
    name: @project.artifactId@
  lifecycle:
    timeout-per-shutdown-phase: 1m
  cloud:
    function:
      definition: functionRouter;sendMessage;sendCorrelateMessage;
    stream:
      bindings:
        functionRouter-in-0:
          destination: "dwf-address-${DIGIWF_ENV}"
          group: dwf-address-service
        sendCorrelateMessage-out-0:
          destination: "dwf-engine-${DIGIWF_ENV}"
        sendMessage-out-0:
          destination: "dwf-engine-${DIGIWF_ENV}"
      function:
        routing:
          enabled: true
      kafka:
        binder:
          configuration:
            security:
              protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
          producerProperties:
            value:
              serializer: org.springframework.kafka.support.serializer.JsonSerializer
            key:
              serializer: org.springframework.kafka.support.serializer.JsonSerializer
          consumerProperties:
            auto:
              offset:
                reset: latest
            key:
              deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            value:
              deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          brokers: ${KAFKA_BOOTSTRAP_SERVER:localhost}:${KAFKA_BOOTSTRAP_SERVER_PORT:29092}
  kafka:
    consumer:
      properties:
        spring:
          json:
            trusted:
              packages: '*'

de:
  muenchen:
    oss:
      digiwf:
        address:
          service:
            url: ${ADDRESS_SERVICE_URL}
